# Read the Docs configuration file for MkDocs
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    pre_build:
      - pip install uv
      - uv sync --group docs
    post_build:
      - uv run mkdocs build --clean --site-dir $READTHEDOCS_OUTPUT/html
